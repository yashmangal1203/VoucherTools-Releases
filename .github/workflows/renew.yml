# TEMPLATE ONLY. Copy into VoucherTools-Releases/.github/workflows/renew.yml
# AFTER reviewing custody/TTL choices and installing the three Secrets.
# No pull_request trigger: untrusted forks must never receive signing secrets.
name: Renew signed update freshness
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: vouchertools-metadata-write
  cancel-in-progress: false
jobs:
  renew:
    if: github.repository == 'yashmangal1203/VoucherTools-Releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/vouchertools-renewal-venv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified Nov18 2026
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6, verified Nov18 2026
        with:
          enable-cache: false
          python-version: '3.14'
      - name: Renew only snapshot and timestamp
        env:
          VT_SNAPSHOT_PEM: ${{ secrets.VT_SNAPSHOT_PEM }}
          VT_TIMESTAMP_PEM: ${{ secrets.VT_TIMESTAMP_PEM }}
          VT_ONLINE_PASSWORD: ${{ secrets.VT_ONLINE_PASSWORD }}
        run: uv run --locked --project maintenance python maintenance/repository.py online-renew --repository .
      - name: Commit and publish public metadata atomically
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --project maintenance python maintenance/ci_guard.py
          git config user.name 'VoucherTools renewal'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run --locked --project maintenance python maintenance/ci_guard.py --stage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Renew signed update freshness'
          # No force/rebase/re-sign on conflict. A concurrent local release wins;
          # this run fails visibly and a rerun signs from the new branch head.
          git push origin HEAD:main
      - name: Expiry warning and failure notification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VT_JOB_STATUS: ${{ job.status }}
        run: uv run --locked --project maintenance python maintenance/ci_guard.py --notify
